# Builds Mnemo for every OS on native runners. Push a tag (v0.1.0) or run it by hand (Actions > Run workflow).
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "zig + cargo-zigbuild (binary compatible with glibc 2.28: Debian 10+, Ubuntu 18.04+, Arch)"
        run: |
          pip install ziglang
          cargo install cargo-zigbuild cargo-deb
          rustup target add aarch64-unknown-linux-gnu
      - run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
      - run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
      - name: package
        run: |
          mkdir -p dist
          mkdir -p target/release && cp target/x86_64-unknown-linux-gnu/release/mnemo target/release/mnemo
          cargo deb --no-build --no-strip -o dist/
          for a in x86_64 aarch64; do
            d=mnemo-linux-$a; mkdir -p $d
            cp target/$a-unknown-linux-gnu/release/mnemo $d/; cp packaging/linux/mnemo.desktop assets/icons/mnemo-256.png README.md $d/
            tar czf dist/$d.tar.gz $d
          done
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir dist
          copy target\release\mnemo.exe dist\mnemo.exe
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-windows, path: dist/* }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-macos, path: dist/Mnemo-macos.dmg }
