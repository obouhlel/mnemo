# Compile Mnemo pour les trois OS en appelant les cibles du Makefile (même chemin qu'en local).
# Se lance en poussant un tag (v0.1.0) ou à la main (Actions › build › Run workflow).
# Sur un tag, le job publish crée la page Releases avec tous les fichiers. À la main, renseigner « version »
# (ex. 0.2.0) publie aussi la release : le tag v<version> est créé sur le commit compilé.
name: build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publier la release v<version> (laisser vide pour seulement compiler)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: make check

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils de compilation croisée (zig pour glibc 2.28)
        run: pip install ziglang && make setup
      - run: make linux deb
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-linux, path: dist/* }

  # Paquet Arch Linux (.pkg.tar.zst), construit dans un conteneur Arch avec le PKGBUILD du dépôt.
  arch:
    needs: check
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git rust libx11 libxkbcommon-x11 libglvnd wayland libxcursor libxrandr libxi
      - uses: actions/checkout@v4
      - name: Paquet (makepkg refuse de tourner en root)
        run: |
          useradd -m build
          chown -R build .
          su build -c "make arch"
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-arch, path: dist/*.pkg.tar.zst }

  windows:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils de compilation croisée (MinGW)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 && make setup
      - run: make windows
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-windows, path: dist/mnemo.exe }

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make macos
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-macos, path: dist/Mnemo-macos.dmg }

  # Appli Android (Android 8.0 et plus). Signée avec la clé des secrets MNEMO_KEYSTORE_BASE64 /
  # MNEMO_KEYSTORE_PASSWORD / MNEMO_KEY_ALIAS / MNEMO_KEY_PASSWORD si elle existe (mises à jour possibles d'une
  # version à l'autre), sinon avec une clé de débogage (désinstaller avant d'installer une nouvelle version).
  android:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.MNEMO_KEYSTORE_BASE64 }}
          MNEMO_KEYSTORE_PASSWORD: ${{ secrets.MNEMO_KEYSTORE_PASSWORD }}
          MNEMO_KEY_ALIAS: ${{ secrets.MNEMO_KEY_ALIAS }}
          MNEMO_KEY_PASSWORD: ${{ secrets.MNEMO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mnemo.jks"
            export MNEMO_KEYSTORE="$RUNNER_TEMP/mnemo.jks"
          fi
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/mnemo-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-android, path: dist/mnemo-android.apk }

  # Sur un tag v* : page Releases publique avec les fichiers à télécharger directement.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [linux, arch, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Fichiers prêts à lancer (binaire Linux seul, .exe nommé)
        run: |
          tar xzf dist/mnemo-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/mnemo-*-linux-x86_64/mnemo dist/mnemo-linux-x86_64
          mv dist/mnemo.exe dist/mnemo-windows-x86_64.exe
          ls -la dist
      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # tag poussé : son nom ; lancement manuel : v<version>, créé sur le commit compilé
          if [ -n "$VERSION" ]; then TAG="v${VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mnemo $TAG" --generate-notes
