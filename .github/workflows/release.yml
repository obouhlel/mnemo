# Compile Mnemo pour les trois OS en appelant les cibles du Makefile (même chemin qu'en local).
# Se lance en poussant un tag (v0.1.0) ou à la main (Actions › build › Run workflow).
# Sur un tag, le job publish crée la page Releases avec tous les fichiers. À la main, renseigner « version »
# (ex. 0.2.0) publie aussi la release : le tag v<version> est créé sur le commit compilé.
name: build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publier la release v<version> (laisser vide pour seulement compiler)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: make check

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils de compilation croisée (zig pour glibc 2.28)
        run: pip install ziglang && make setup
      - run: make linux deb
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-linux, path: dist/* }

  windows:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils de compilation croisée (MinGW)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 && make setup
      - run: make windows
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-windows, path: dist/mnemo.exe }

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make macos
      - uses: actions/upload-artifact@v4
        with: { name: mnemo-macos, path: dist/Mnemo-macos.dmg }

  # Sur un tag v* : page Releases publique avec les fichiers à télécharger directement.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Fichiers prêts à lancer (binaire Linux seul, .exe nommé)
        run: |
          tar xzf dist/mnemo-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/mnemo-*-linux-x86_64/mnemo dist/mnemo-linux-x86_64
          mv dist/mnemo.exe dist/mnemo-windows-x86_64.exe
          ls -la dist
      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # tag poussé : son nom ; lancement manuel : v<version>, créé sur le commit compilé
          if [ -n "$VERSION" ]; then TAG="v${VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mnemo $TAG" --generate-notes
